services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: promomanager_dev
      POSTGRES_PASSWORD: promomanager_dev
      POSTGRES_DB: promomanager_dev
    ports:
      - "5432:5432"
      - "5433:5433"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - promomanager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: '256M'

